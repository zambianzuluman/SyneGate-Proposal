<style>
  :root{--broom:#FBF320;--dolly:#FAFD86;--daintree:#002535}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;background:var(--daintree);font-family:Inter,system-ui,sans-serif;color:#c9d7dc;padding:24px}

  p{font-size:15px;margin-bottom:24px}
  label{display:block;font-size:13px;font-weight:600;color:#fff;margin-bottom:8px}
  input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:8px;border:1px solid #1a4a5c;background:#0a3446;color:#fff;outline:none}
  input:focus{border-color:var(--broom)}
  button{margin-top:12px;width:100%;font:inherit;font-weight:600;font-size:15px;padding:12px;border:0;border-radius:8px;background:var(--broom);color:var(--daintree);cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .err{min-height:20px;margin-top:10px;font-size:13px;color:#ffb4a8}
  .bar{height:4px;background:var(--broom);position:fixed;left:0;right:0;bottom:0}
</style>

async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.salt),iterations:D.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.iv)},key,u(D.ct));
  return new TextDecoder().decode(pt);
}
